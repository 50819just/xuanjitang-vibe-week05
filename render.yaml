services:
  - type: web
    name: xuanjitang-week05-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: ECPAY_ENV
        value: stage
      - key: DEMO_CONFIRM_ENABLED
        value: true
      - key: APP_BASE_URL
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
# APP_BASE_URL 與 FRONTEND_BASE_URL 須填入新服務及新 Pages 的實際網址，不能用舊站。
# 免費方案 server/data 是暫存資料，休眠或重啟可能遺失；只供短期測試。
