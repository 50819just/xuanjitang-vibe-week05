services:
  - type: web
    name: xuanjitang-week05-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: ECPAY_ENV
        value: stage
      - key: DEMO_CONFIRM_ENABLED
        value: true
      - key: FRONTEND_BASE_URL
        value: https://50819just.github.io/xuanjitang-vibe-week05
# APP_BASE_URL 未設定時自動使用 Render 注入的 RENDER_EXTERNAL_URL，避免猜測新服務網址。
# 免費方案 server/data 是暫存資料，休眠或重啟可能遺失；只供短期測試。
